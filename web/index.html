<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字档案长期保存</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}input,textarea,button,select{font:inherit;padding:8px;margin:4px}textarea{width:100%;height:110px}.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin:12px 0}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}.ok{color:#0a7d28}.bad{color:#c62828}.warn{color:#b26a00}</style></head>
<body><h1>数字档案长期保存</h1><p>演示账号：owner、archivist、auditor、outsider。请求使用 <code>X-User-Id</code>。</p>
<section class="panel"><select id="user"><option>owner</option><option>archivist</option><option>auditor</option><option>outsider</option></select>
<button onclick="loadStatus()">查看档案状态</button>
<input id="aid" size="3" value="1">
<button onclick="loadVersion()">查看版本 1</button>
<pre id="out"></pre></section>

<section class="panel"><h3>保护要求（独立保管域）</h3>
档案 <input id="paid" size="3" value="1">
需要独立保管域 <input id="domains" size="3" value="2"> 个，
校验有效期 <input id="vdays" size="3" value="30"> 天（0=立即过期）
<button onclick="setProtection()">提交并立即重算</button>
<button onclick="recomputeAll()">批量续跑重算（全局）</button>
</section>

<section class="panel"><h3>副本操作</h3>
版本 <input id="cvid" size="3" value="1">，位置 <input id="loc" size="14" placeholder="offline-disk-a">，
保管域 <input id="cdom" size="12" placeholder="dc-east">
<button onclick="addCopy()">登记副本（必填保管域）</button><br>
副本 <input id="copyid" size="3" value="1">
<button onclick="verifyCopy()">校验</button>
<button onclick="markUnreadable()">读不出（待确认）</button>
</section>
<p>详细接口见 README。核心流程由 JSON API 提供；保护状态在版本详情（<code>/api/versions/{id}</code> 的 <code>protection</code>）与档案状态（<code>/api/archives/{id}/status</code>）中实时一致。</p>
<script>
const out=document.querySelector("#out"),user=document.querySelector("#user");
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json","X-User-Id":user.value}},opts));return r.json()}
function show(d){out.textContent=JSON.stringify(d,null,2)}
async function loadStatus(){show(await api(`/api/archives/${paid.value||aid.value}/status`))}
async function loadVersion(){show(await api(`/api/versions/${aid.value}`))}
async function setProtection(){show(await api(`/api/archives/${paid.value}/protection`,{method:"POST",body:JSON.stringify({required_domains:Number(domains.value),verify_valid_days:Number(vdays.value)})}))}
async function recomputeAll(){show(await api(`/api/protection/recompute`,{method:"POST",body:"{}"}))}
async function addCopy(){show(await api(`/api/versions/${cvid.value}/copies`,{method:"POST",body:JSON.stringify({location:loc.value,domain:cdom.value})}))}
async function verifyCopy(){show(await api(`/api/copies/${copyid.value}/verify`,{method:"POST"}))}
async function markUnreadable(){show(await api(`/api/copies/${copyid.value}/unconfirmed`,{method:"POST",body:JSON.stringify({reason:"页面登记：介质无法读取"})}))}
</script></body></html>
